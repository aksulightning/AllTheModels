plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
		content {
			includeGroup("me.djtheredstoner")
		}
	}

	// Mod Menu
	maven { url = "https://api.modrinth.com/maven" }
}

loom {
	splitEnvironmentSourceSets()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// --- LWJGL add-ons ---
	String lwjglAddonVersion = "3.4.1";
	// For IDE
	implementation "org.lwjgl:lwjgl-nfd:${lwjglAddonVersion}"
	// Include for builds
	include "org.lwjgl:lwjgl-nfd:${lwjglAddonVersion}"
	include "org.lwjgl:lwjgl-nfd:${lwjglAddonVersion}:natives-windows"
	include "org.lwjgl:lwjgl-nfd:${lwjglAddonVersion}:natives-windows-arm64"
	include "org.lwjgl:lwjgl-nfd:${lwjglAddonVersion}:natives-linux"
	include "org.lwjgl:lwjgl-nfd:${lwjglAddonVersion}:natives-linux-arm64"
	include "org.lwjgl:lwjgl-nfd:${lwjglAddonVersion}:natives-macos"
	include "org.lwjgl:lwjgl-nfd:${lwjglAddonVersion}:natives-macos-arm64"

	// --- Full model import for FBX ---
	implementation "org.lwjgl:lwjgl-assimp:${lwjglAddonVersion}"
	include "org.lwjgl:lwjgl-assimp:${lwjglAddonVersion}"
	include "org.lwjgl:lwjgl-assimp:${lwjglAddonVersion}:natives-windows"
	include "org.lwjgl:lwjgl-assimp:${lwjglAddonVersion}:natives-windows-arm64"
	include "org.lwjgl:lwjgl-assimp:${lwjglAddonVersion}:natives-linux"
	include "org.lwjgl:lwjgl-assimp:${lwjglAddonVersion}:natives-linux-arm64"
	include "org.lwjgl:lwjgl-assimp:${lwjglAddonVersion}:natives-macos"
	include "org.lwjgl:lwjgl-assimp:${lwjglAddonVersion}:natives-macos-arm64"

	// --- For glb parsing ---
	include implementation ("de.javagl:jgltf-model:2.0.4")
	include implementation ("de.javagl:jgltf-impl-v2:2.0.4")

	// --- For Dev Env ---
	runtimeOnly "org.lwjgl:lwjgl-nfd:${lwjglAddonVersion}:natives-windows"
	runtimeOnly "org.lwjgl:lwjgl-nfd:${lwjglAddonVersion}:natives-windows-arm64"
	runtimeOnly "org.lwjgl:lwjgl-nfd:${lwjglAddonVersion}:natives-linux"
	runtimeOnly "org.lwjgl:lwjgl-nfd:${lwjglAddonVersion}:natives-linux-arm64"
	runtimeOnly "org.lwjgl:lwjgl-nfd:${lwjglAddonVersion}:natives-macos"
	runtimeOnly "org.lwjgl:lwjgl-nfd:${lwjglAddonVersion}:natives-macos-arm64"
	runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjglAddonVersion}:natives-windows"
	runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjglAddonVersion}:natives-windows-arm64"
	runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjglAddonVersion}:natives-linux"
	runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjglAddonVersion}:natives-linux-arm64"
	runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjglAddonVersion}:natives-macos"
	runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjglAddonVersion}:natives-macos-arm64"

	// Mod Menu
	api "maven.modrinth:modmenu:${project.modmenu_version}"
}

jar {
	archiveFileName.set("${project.archives_base_name}-v${project.mod_version}+mc${project.minecraft_version}.jar")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("jar") {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
