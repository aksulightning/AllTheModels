name: nightly

on:
  push:
    branches:
      - master
      - 1.21.1

  schedule:
    # Ajaa joka yö klo 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: master
            tag: nightly
            release_name: Nightly Build
            artifact_name: all-the-models-nightly

          - branch: 1.21.1
            tag: nightly-1.21.1
            release_name: Nightly Build 1.21.1
            artifact_name: all-the-models-1.21.1

    steps:
      - name: checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "microsoft"

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: capture build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: build/libs/

      - name: delete old release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ matrix.tag }}" --yes --cleanup-tag || true

      - name: create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.tag }}
          target_commitish: ${{ matrix.branch }}
          name: ${{ matrix.release_name }}
          body: |
            Automaattinen nightly build.

            Branch: ${{ matrix.branch }}
            Commit: ${{ github.sha }}
          prerelease: true
          files: build/libs/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
