name: nightly

on:
  push:
    branches:
      - master
      - 1.21.1

  schedule:
    # Ajaa joka yö klo 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: master
            tag: nightly
            release_name: Nightly Build
            artifact_name: all-the-models-nightly

          - branch: 1.21.1
            tag: nightly-1.21.1
            release_name: Nightly Build 1.21.1
            artifact_name: all-the-models-1.21.1

    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "microsoft"

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: capture build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: build/libs/

      - name: prepare release tag
        env:
          TAG_NAME: ${{ matrix.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f "$TAG_NAME"
          git push --force origin "refs/tags/$TAG_NAME"

          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: delete old release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ matrix.tag }}
        run: |
          gh release delete "$TAG_NAME" --yes || true

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ matrix.tag }}
          RELEASE_NAME: ${{ matrix.release_name }}
          BRANCH_NAME: ${{ matrix.branch }}
        run: |
          gh release create "$TAG_NAME" build/libs/* \
            --title "$RELEASE_NAME" \
            --notes "Automaattinen nightly build.

          Branch: $BRANCH_NAME
          Commit: $COMMIT_SHA" \
            --prerelease \
            --verify-tag
